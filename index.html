<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover で、iPhoneの丸い角やノッチの内側まで背景を広げます -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お薬管理</title>

<!-- ホーム画面に追加したときにアプリのように開くための設定です -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="お薬管理">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32">

<link rel="stylesheet" href="./tailwind.css">
<style>
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #e5e7eb;
    /* 画面を上下に引っ張ったときの跳ね返りを抑えます */
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP",
                 "Helvetica Neue", Arial, sans-serif;
  }
  /* 画面いっぱいの高さ。dvhはSafariのアドレスバーの伸び縮みに追従します */
  .app-min-h { min-height: 100vh; min-height: 100dvh; }
  #root { min-height: 100vh; min-height: 100dvh; }

  /* ボタンをタップしたときの青い枠や、ダブルタップの拡大を抑えます */
  button, a, label, select, input[type="file"] { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { -webkit-appearance: none; appearance: none; }
  select { -webkit-appearance: none; appearance: none; }
  /* iOSは文字が16px未満の入力欄で自動的に画面を拡大するため、16pxを下回らないようにします */
  input, select, textarea { font-size: 16px; }
  input[type="datetime-local"] { min-height: 3.4rem; }

  /* ノッチやホームバーにかからないよう、安全領域の分だけ余白を足します */
  .safe-top    { padding-top: calc(1rem + env(safe-area-inset-top)); }
  .safe-bottom { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
  .main-pad    { padding-bottom: calc(9rem + env(safe-area-inset-bottom)); }
  .safe-modal-bottom { padding-bottom: calc(2.5rem + env(safe-area-inset-bottom)); }
  .toast-pos   { top: calc(0.75rem + env(safe-area-inset-top)); }

  .modal-sheet { animation: sheet-up 0.22s ease-out; }
  @keyframes sheet-up { from { transform: translateY(14px); opacity: 0.4; } to { transform: none; opacity: 1; } }

  /* 読み込み中の表示 */
  #boot { display: flex; flex-direction: column; align-items: center; justify-content: center;
          min-height: 70vh; padding: 1.5rem; text-align: center;
          color: #9ca3af; font-size: 0.85rem; font-weight: 700; }
  #boot-err { display: none; margin-top: 1rem; max-width: 22rem; color: #b91c1c;
              background: #fef2f2; border: 1px solid #fecaca; border-radius: 1rem;
              padding: 1rem 1.1rem; font-weight: 500; font-size: 0.8rem;
              line-height: 1.8; text-align: left; }
  #boot-err b { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; }
  #boot-err code { display: block; margin-top: 0.5rem; padding: 0.5rem 0.6rem; background: #fff;
                   border-radius: 0.5rem; color: #7f1d1d; font-size: 0.72rem;
                   word-break: break-all; }
</style>
</head>
<body class="flex justify-center items-start">
  <div id="root" class="w-full max-w-md bg-gray-50 shadow-2xl relative flex flex-col">
    <div id="boot">
      <span id="boot-msg">読み込んでいます…</span>
      <div id="boot-err"></div>
    </div>
  </div>

  <script>
    // 起動できなかったときに、原因を画面に出すための下準備です
    window.__missing = [];
    window.__error = null;
    window.__miss = function (f) { window.__missing.push(f); };
    window.addEventListener("error", function (e) {
      if (!window.__error && e && e.message) window.__error = e.message;
    });
  </script>

  <script src="./app.js" onerror="__miss('app.js')"></script>

  <script>
    // オフラインでも起動できるように、ファイルを端末に保存しておきます
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }

    // 画面のCSSが読み込めているかを確かめます
    (function () {
      var probe = document.createElement("div");
      probe.className = "hidden";
      document.body.appendChild(probe);
      var ok = getComputedStyle(probe).display === "none";
      document.body.removeChild(probe);
      if (!ok) window.__miss("tailwind.css");
    })();

    // 4秒たっても画面が出ないときは、分かっている原因を表示します
    setTimeout(function () {
      var boot = document.getElementById("boot");
      if (!boot || !document.body.contains(boot)) return;  // 起動できていれば何もしない

      var msg = document.getElementById("boot-msg");
      var box = document.getElementById("boot-err");
      var html = "";

      if (window.__missing.length > 0) {
        html += "<b>必要なファイルが見つかりませんでした</b>" +
                "次のファイルを、index.html とまったく同じ場所に置いてください。" +
                "フォルダごとではなく、中身のファイルを直接並べる必要があります。" +
                "<code>" + window.__missing.join("<br>") + "</code>";
      } else if (window.__error) {
        html += "<b>読み込み中にエラーが起きました</b>" +
                "次の内容をそのまま伝えていただければ、こちらで原因を調べます。" +
                "<code>" + String(window.__error).replace(/</g, "&lt;") + "</code>";
      } else {
        html += "<b>画面を表示できませんでした</b>" +
                "ページを再読み込みしても直らない場合は、この画面の写真を送ってください。" +
                "<code>" + String(location.href).replace(/</g, "&lt;") + "</code>";
      }

      if (msg) msg.textContent = "アプリを起動できませんでした";
      if (box) { box.innerHTML = html; box.style.display = "block"; }
    }, 4000);
  </script>
</body>
</html>
